<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #e2e8f0;
      --bg-tertiary: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1e40af;
      --success: #1bc47d;
      --warning: #f24822;
      --border: #94a3b8;
      --radius: 6px;
      --space: 4px;
    }

    html, body {
      width: 100%;
      height: fit-content;
      overflow: hidden;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: fit-content;
    }

    section.top-section {
      padding: calc(var(--space) * 6) calc(var(--space) * 4);
      background: oklch(from var(--accent) l c h / 0.05);
      display: flex;
      flex-direction: column;
      gap: calc(var(--space) * 4);
      position: relative;
  }

  section.bottom-section {
    padding: calc(var(--space) * 4);
    display: flex;
    flex-direction: column;
    gap: calc(var(--space) * 4);
    position: relative;
  }

    .header {
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
      gap: 4px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-icon {
      width: 38px;
      height: 38px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--accent);
    }

    .header p {
      color: var(--text-muted);
      font-size: 10px;
    }

    .version {
      color: var(--accent);
      background: var(--bg-secondary);
      font-size: 8px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: calc(var(--radius) * 4);
    }

    .copy-section-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .selection-status {
      padding: 8px 12px;
    }

    .selection-status .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .selection-status .value {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .selection-status .value .type-badge {
      font-size: 9px;
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--text-secondary);
    }

    .selection-status.empty .value {
      color: var(--text-muted);
      font-style: italic;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: white;
    }

    .properties-section-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom:6px;
      }

    .copy-section {
      margin-bottom: 0;
    }

    .copied-info {
    padding: 6px 10px;
    background: rgba(27, 196, 125, 0.05);
    border: 1px solid rgba(27, 196, 125, 1);
    border-radius: calc(var(--radius) * 4);
    font-size: 11px;
    color: var(--success);
    display: none;
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: bold;
    text-transform: uppercase;
}

    .copied-info.visible {
      display: block;
    }

    .copied-info .source-name {
    font-weight: 600;
    width: 0;
    display: inline-block;
    opacity: 0;
    visibility: hidden;
    height: 0;
}

    .properties-section {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .properties-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .property-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-secondary);
      border-radius: var(--radius);
      transition: background 0.15s ease;
    }

    .property-item:hover {
      background: var(--bg-tertiary);
    }

    .property-item.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .property-item input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .property-item label {
      flex: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .property-item .icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .property-item .icon svg {
      width: 14px;
      height: 14px;
    }

    .property-item .name {
      font-weight: 500;
    }

    .paste-section {
      margin-top: auto;
    }

    .message {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 11px;
      display: none;
    }

    .message.visible {
      display: block;
    }

    .message.success {
      background: rgba(27, 196, 125, 0.1);
      border: 1px solid rgba(27, 196, 125, 0.3);
      color: var(--success);
    }

    .message.error {
      background: rgba(242, 72, 34, 0.1);
      border: 1px solid rgba(242, 72, 34, 0.3);
      color: var(--warning);
    }

    .message.info {
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.3);
      color: var(--accent);
    }

    .select-all-row {
      display: flex;
      justify-content: flex-end;
    }

    .select-all-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .select-all-btn:hover {
      background: var(--bg-secondary);
    }

    .select-all-btn:disabled {
      color: var(--text-muted);
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <section class="top-section">
    <div class="header">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><rect width="24" height="24" fill="#eef2ff" rx="6"/><g clip-path="url(#a)"><path stroke="#4f46e5" stroke-linecap="round" stroke-linejoin="round" d="M14.25 7.5h1.125A1.125 1.125 0 0 1 16.5 8.625V16.5a1.125 1.125 0 0 1-1.125 1.125h-6.75A1.125 1.125 0 0 1 7.5 16.5V8.625A1.125 1.125 0 0 1 8.625 7.5H9.75M12 11.438h2.25M12 14.25h2.25m-4.5-2.812h.006M9.75 14.25h.006m.556-7.875h3.376c.31 0 .562.252.562.563v1.125c0 .31-.252.562-.562.562h-3.376a.56.56 0 0 1-.562-.562V6.937c0-.31.252-.562.563-.562"/></g><defs><clipPath id="a"><path fill="#fff" d="M5.25 5.25h13.5v13.5H5.25z"/></clipPath></defs></svg>
      </div>
      <div class="header-content">
        <div class="header-title">
          <h1>CopyOne</h1>
          <p class="version" id="versionLabel"></p>
        </div>
        <p>Copy and paste specific properties</p>
      </div>
    </div>
  
    <div class="copy-section-container">
      <div class="selection-status empty" id="selectionStatus">
        <div class="label">Current Selection</div>
        <div class="value" id="selectionValue">No selection</div>
      </div>

      <button class="btn btn-primary" id="copyBtn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copy Properties
      </button>
      <div class="copied-info" id="copiedInfo">
        Copied! <span class="source-name" id="sourceName"></span>
      </div>
    </div>
  </section>

  <section class="bottom-section">
    <div class="properties-section">
      <div class="properties-section-header">
        <div class="section-title">Properties to Paste</div>
        <div class="select-all-row">
          <button class="select-all-btn" id="selectAllBtn" disabled>Select All</button>
        </div>
      </div>
      <div class="properties-list" id="propertiesList">
        <div class="property-item disabled" data-property="fills">
          <input type="checkbox" id="prop-fills" disabled>
          <label for="prop-fills">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            </span>
            <span class="name">Fills</span>
          </label>
        </div>
        <div class="property-item disabled" data-property="strokes">
          <input type="checkbox" id="prop-strokes" disabled>
          <label for="prop-strokes">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            </span>
            <span class="name">Strokes</span>
          </label>
        </div>
        <div class="property-item disabled" data-property="effects">
          <input type="checkbox" id="prop-effects" disabled>
          <label for="prop-effects">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
            </span>
            <span class="name">Effects</span>
          </label>
        </div>
        <div class="property-item disabled" data-property="cornerRadius">
          <input type="checkbox" id="prop-cornerRadius" disabled>
          <label for="prop-cornerRadius">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9V5a2 2 0 012-2h4M3 15v4a2 2 0 002 2h4m8-18h4a2 2 0 012 2v4m0 6v4a2 2 0 01-2 2h-4"/></svg>
            </span>
            <span class="name">Corner Radius</span>
          </label>
        </div>
        <div class="property-item disabled" data-property="opacityBlend">
          <input type="checkbox" id="prop-opacityBlend" disabled>
          <label for="prop-opacityBlend">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill-opacity="0.5"/></svg>
            </span>
            <span class="name">Opacity & Blend</span>
          </label>
        </div>
        <div class="property-item disabled" data-property="textStyles">
          <input type="checkbox" id="prop-textStyles" disabled>
          <label for="prop-textStyles">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
            </span>
            <span class="name">Text Styles</span>
          </label>
        </div>
      </div>
    </div>
  
    <div class="paste-section">
      <button class="btn btn-secondary" id="pasteBtn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        Paste Selected
      </button>
      <div class="message" id="message"></div>
    </div>
  </section>

  <script>
    // State
    let hasSelection = false;
    let hasCopiedProperties = false;
    let availableProperties = [];

    // DOM Elements
    const selectionStatus = document.getElementById('selectionStatus');
    const selectionValue = document.getElementById('selectionValue');
    const copyBtn = document.getElementById('copyBtn');
    const copiedInfo = document.getElementById('copiedInfo');
    const sourceName = document.getElementById('sourceName');
    const versionLabel = document.getElementById('versionLabel');
    const propertiesList = document.getElementById('propertiesList');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const message = document.getElementById('message');
    let resizeRafId = null;

    function requestResize() {
      if (resizeRafId !== null) {
        cancelAnimationFrame(resizeRafId);
      }
      resizeRafId = requestAnimationFrame(() => {
        resizeRafId = null;
        const height = document.documentElement.scrollHeight;
        parent.postMessage({ pluginMessage: { type: 'resize-ui', height } }, '*');
      });
    }

    // Property checkboxes
    const propertyCheckboxes = {
      fills: document.getElementById('prop-fills'),
      strokes: document.getElementById('prop-strokes'),
      effects: document.getElementById('prop-effects'),
      cornerRadius: document.getElementById('prop-cornerRadius'),
      opacityBlend: document.getElementById('prop-opacityBlend'),
      textStyles: document.getElementById('prop-textStyles'),
    };

    // Update UI based on selection
    function updateSelectionUI(data) {
      hasSelection = data.hasSelection;
      
      if (data.hasSelection) {
        selectionStatus.classList.remove('empty');
        selectionValue.textContent = '';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = data.nodeName;
        selectionValue.appendChild(nameSpan);
        if (data.nodeType !== 'MULTIPLE') {
          const badge = document.createElement('span');
          badge.className = 'type-badge';
          badge.textContent = data.nodeType;
          selectionValue.appendChild(badge);
        }
      } else {
        selectionStatus.classList.add('empty');
        selectionValue.textContent = 'No selection';
      }

      updateButtonStates();
      requestResize();
    }

    // Update available properties after copy
    function updatePropertiesUI(data) {
      hasCopiedProperties = true;
      availableProperties = data.availableProperties;

      // Show copied info
      copiedInfo.classList.add('visible');
      if (sourceName && data.properties?.sourceName) {
        sourceName.textContent = data.properties.sourceName;
      }

      // Enable/disable property items based on availability
      Object.keys(propertyCheckboxes).forEach(prop => {
        const item = document.querySelector(`[data-property="${prop}"]`);
        const checkbox = propertyCheckboxes[prop];
        
        if (availableProperties.includes(prop)) {
          item.classList.remove('disabled');
          checkbox.disabled = false;
          checkbox.checked = true; // Auto-select available properties
        } else {
          item.classList.add('disabled');
          checkbox.disabled = true;
          checkbox.checked = false;
        }
      });

      selectAllBtn.disabled = availableProperties.length === 0;
      updateButtonStates();
      requestResize();
    }

    // Update button states
    function updateButtonStates() {
      copyBtn.disabled = !hasSelection;
      
      const hasCheckedProperties = Object.values(propertyCheckboxes).some(cb => cb.checked && !cb.disabled);
      pasteBtn.disabled = !hasSelection || !hasCopiedProperties || !hasCheckedProperties;
    }

    // Get selected properties
    function getSelectedProperties() {
      return Object.entries(propertyCheckboxes)
        .filter(([_, checkbox]) => checkbox.checked && !checkbox.disabled)
        .map(([prop, _]) => prop);
    }

    let messageTimer = null;

    // Show message
    function showMessage(text, type) {
      if (messageTimer) {
        clearTimeout(messageTimer);
        messageTimer = null;
      }
      message.textContent = text;
      message.className = `message visible ${type}`;

      // Auto-hide success and info messages; errors stay until next action
      if (type !== 'error') {
        messageTimer = setTimeout(() => {
          message.classList.remove('visible');
          messageTimer = null;
          requestResize();
        }, 4000);
      }
      requestResize();
    }

    // Dismiss persistent messages on next user action
    function dismissMessage() {
      if (messageTimer) {
        clearTimeout(messageTimer);
        messageTimer = null;
      }
      message.classList.remove('visible');
      requestResize();
    }

    // Event Listeners
    copyBtn.addEventListener('click', () => {
      dismissMessage();
      parent.postMessage({ pluginMessage: { type: 'copy' } }, '*');
    });

    pasteBtn.addEventListener('click', () => {
      dismissMessage();
      const properties = getSelectedProperties();
      parent.postMessage({ pluginMessage: { type: 'paste', properties } }, '*');
    });

    selectAllBtn.addEventListener('click', () => {
      const allChecked = availableProperties.every(prop => propertyCheckboxes[prop].checked);
      
      availableProperties.forEach(prop => {
        propertyCheckboxes[prop].checked = !allChecked;
      });
      
      selectAllBtn.textContent = allChecked ? 'Select All' : 'Deselect All';
      updateButtonStates();
    });

    // Update select all button text on individual checkbox change
    Object.values(propertyCheckboxes).forEach(checkbox => {
      checkbox.addEventListener('change', () => {
        const allChecked = availableProperties.every(prop => propertyCheckboxes[prop].checked);
        selectAllBtn.textContent = allChecked ? 'Deselect All' : 'Select All';
        updateButtonStates();
      });
    });

    // Handle messages from plugin
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      switch (msg.type) {
        case 'version':
          versionLabel.textContent = `v${msg.version}`;
          requestResize();
          break;
        case 'selection-changed':
          updateSelectionUI(msg);
          break;
        case 'properties-copied':
          updatePropertiesUI(msg);
          break;
        case 'paste-complete':
          showMessage(msg.message, msg.success ? 'success' : 'error');
          break;
        case 'info':
          showMessage(msg.message, 'info');
          break;
        case 'error':
          showMessage(msg.message, 'error');
          break;
      }
    };

    // Request initial selection state
    parent.postMessage({ pluginMessage: { type: 'get-selection' } }, '*');
    requestResize();
  </script>
</body>
</html>
